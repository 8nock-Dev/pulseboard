version: '3.8'

services:

  # ─── PostgreSQL Database ──────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: pulseboard_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       pulseboard
      POSTGRES_USER:     pulseboard
      POSTGRES_PASSWORD: pulseboard_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseboard -d pulseboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Node.js Backend ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulseboard_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV:     production
      PORT:         3001
      DATABASE_URL: postgresql://pulseboard:pulseboard_secret@db:5432/pulseboard
      JWT_SECRET:   change_this_to_a_long_random_secret_before_deploying
      FRONTEND_URL: http://localhost:5173
      APP_URL:      http://localhost:5173
      # Optional — fill in to enable email alerts
      SMTP_HOST:    ""
      SMTP_PORT:    "587"
      SMTP_SECURE:  "false"
      SMTP_USER:    ""
      SMTP_PASS:    ""
      SMTP_FROM:    ""
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
